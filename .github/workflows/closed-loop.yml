name: closed-loop
# CLOSED-LOOP-1 (Rowan, 2026-11-12): no new document without a consuming loop, no new wait on a person. Under a minute per PR.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: closed-loop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  closed-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/closed_loop_check.py --base "origin/${{ github.base_ref }}"
      # CLOCKWORK-1: every scheduled workflow names its clock (the qnfo-cloud-ops watchdog row that detects a missed or wrong run).
      - name: Every scheduled workflow has a clock
        run: |
          bad=0; for f in .github/workflows/*.yml; do grep -q '^ *schedule:' "$f" || continue; grep -q '^# clock: ' "$f" || { echo "::error file=$f::scheduled workflow without a '# clock: <loop>' line (CLOCKWORK-1)"; bad=1; }; done; exit $bad
